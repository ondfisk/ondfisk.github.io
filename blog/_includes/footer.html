<footer class="site-footer h-card">
  <data class="u-url" href="{{ '/' | relative_url }}"></data>

  <div class="wrapper">
    <h2 class="footer-heading">{{ site.title | escape }}</h2>

    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name">
            {%- if site.author -%} {{ site.author | escape }} {%- else -%} {{
            site.title | escape }} {%- endif -%}
          </li>
          {%- if site.email -%}
          <li>
            <i class="fa-solid fa-envelope"></i>
            <a class="u-email" href="mailto:{{ site.email }}">
              {{ site.email }}</a
            >
          </li>
          {%- endif -%}
        </ul>
      </div>

      <div class="footer-col footer-col-2">{%- include social.html -%}</div>

      <div class="footer-col footer-col-3">
        <p>{{- site.description | escape -}}</p>
        <p>
          <a
            href="https://www.simpleanalytics.com?utm_source=ondfisk.dk&utm_content=badge"
            referrerpolicy="origin"
            target="_blank"
          >
            <img
              src="https://simpleanalyticsbadges.com/ondfisk.dk?background=transparent&text=677779&logo=3fb68b&border=677779&radius=3&border-width=1&counter=false"
              width="210"
              height="50"
              alt="Simple Analytics"
              loading="lazy"
              referrerpolicy="no-referrer"
              crossorigin="anonymous"
            />
          </a>
        </p>
      </div>
    </div>
  </div>
</footer>

<!-- 100% privacy-first analytics -->
<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
<noscript
  ><img
    src="https://queue.simpleanalyticscdn.com/noscript.gif"
    alt=""
    referrerpolicy="no-referrer-when-downgrade"
/></noscript>
